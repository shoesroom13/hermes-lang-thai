    browser:
      useRealProfile: การท่องเว็บในเครื่องใช้การลงชื่อเข้าใช้จริงของคุณ Hermes จะคัดลอกโปรไฟล์ของเบราว์เซอร์เริ่มต้นของคุณ (คุกกี้ การลงชื่อเข้าใช้ การตั้งค่า) ไปเป็นสแนปช็อตที่จัดการไว้ แล้วขับเคลื่อนด้วย Chromium ที่มาพร้อมแอป — โปรไฟล์จริงของคุณจะไม่ถูกเปิดโดยตรง และสำเนาจะถูกอัปเดตจากโปรไฟล์จริงทุกครั้งที่รัน อีกทั้งยังให้เอเจนต์เปิดเซสชันโปรไฟล์จริงในเครื่องได้ตามคำขอ แม้จะตั้งค่าแบ็กเอนด์เบราว์เซอร์บนคลาวด์ไว้ รองรับเฉพาะเบราว์เซอร์ตระกูล Chromium (Chrome, Edge, Brave, Brave Origin, Chromium) หากค่าเริ่มต้นไม่ใช่ Chromium จะล้มเหลวพร้อมข้อความที่ชัดเจน ปิดไว้เป็นค่าเริ่มต้น
