    error_near_max_iterations: เกิดข้อผิดพลาดใกล้กับขีดจำกัดรอบการใช้เครื่องมือ ก่อนได้คำตอบสุดท้าย โปรดตรวจสอบผลลัพธ์ของเครื่องมือด้านบน แล้วส่ง `continue`
    repeated_outer_errors: เทิร์นนี้ล้มเหลวซ้ำ ๆ จากข้อผิดพลาดเดิม จึงหยุดก่อนที่จะลองใหม่ไม่รู้จบ โปรดตรวจสอบข้อผิดพลาดด้านบน แล้วส่ง `continue` เพื่อลองใหม่
  persistence:
    compression: เทิร์นนี้หยุดลงเพราะมีโพรเซสอื่นกำลังบีบอัดเซสชันนี้ ข้อความของคุณน่าจะถูกบันทึกแล้ว — โปรดส่งอีกครั้งหลังบีบอัดเสร็จ
    compression_closed: เทิร์นนี้หยุดลงเพราะเซสชันนี้ถูกหมุนเวียนจากการบีบอัดบริบท และไม่สามารถนำการทำต่อที่กำลังทำงานอยู่มาใช้ได้ ตัวจัดเก็บข้อมูลเองยังปกติดี — รีเฟรชไคลเอนต์ (หรือเริ่มเทิร์นใหม่) เพื่อให้รับ session id ใหม่ แล้วส่งข้อความของคุณอีกครั้ง
    turn_lease: เทิร์นนี้หยุดลงเพราะโพรเซส Hermes อื่นเข้าคุมเซสชันนี้ คำตอบของคุณไม่ได้ถูกบันทึก — รอให้โพรเซสนั้นทำงานเสร็จ แล้วส่งข้อความของคุณอีกครั้ง
    session_row_missing: เซสชันนี้ถูกลบออกจากที่จัดเก็บข้อมูลขณะที่แชทยังเปิดอยู่ และ Hermes สร้างใหม่ไม่ได้ ข้อความนี้จึงไม่ได้ถูกบันทึก ส่งข้อความของคุณอีกครั้ง หากยังล้มเหลวอยู่ ให้รัน `hermes {profile_arg}doctor`
    locked: เทิร์นนี้หยุดลงเพราะที่จัดเก็บข้อมูลเซสชันถูกใช้งานอยู่ (โพรเซส Hermes อื่นกำลังเขียนลงฐานข้อมูลสถานะ) ข้อความของคุณน่าจะถูกบันทึกแล้ว — โปรดส่งอีกครั้งในครู่เดียว
    replaced: ไฟล์ฐานข้อมูลเซสชันถูกแทนที่ขณะ Hermes กำลังทำงาน ข้อความนี้จึงไม่ได้ถูกบันทึก (เก็บสำเนาอยู่ที่ {home}/sessions/) ให้หยุด Hermes (`hermes {profile_arg}gateway stop`) แล้วรัน `hermes {profile_arg}doctor` — ไม่ใช่ `hermes {profile_arg}doctor --fix` เพราะคำสั่งนั้นจะไปซ่อมไฟล์ผิดตัวแทน — จากนั้นเริ่มใหม่แล้วส่งข้อความของคุณอีกครั้ง ขั้นตอนการกู้คืนขั้นสูงอยู่ในล็อก
    deleted_wal: 'โพรเซส Hermes อื่นยังถือสำเนาเก่าของ write-ahead log ของฐานข้อมูลเซสชันอยู่ จึงหยุดการเขียนเพื่อรักษาไฟล์ให้ปลอดภัย และข้อความนี้ไม่ได้ถูกบันทึก (เก็บสำเนาอยู่ที่ {home}/sessions/) ไม่มีข้อมูลหายเลย ให้ปิดโพรเซส Hermes ทั้งหมดของโปรไฟล์นี้ (แอป Desktop, `hermes {profile_arg}gateway stop`, dashboard, cron) แล้วรัน `hermes {profile_arg}doctor` — มันจะระบุโพรเซสที่ยังถือล็อกอยู่ — จากนั้นเริ่ม Hermes ใหม่และส่งข้อความของคุณอีกครั้ง ห้ามรัน `doctor --fix` หรือลบไฟล์ state.db ใด ๆ ขณะที่ยังทำงานอยู่ คู่มือ: {recovery_docs}'
    corrupt: "เทิร์นนี้หยุดลงเพราะฐานข้อมูลสถานะรายงานความเสียหายเชิงโครงสร้าง (ถ้าเริ่มใหม่ บทสนทนาจะหายทั้งหมด) การเคลียร์พื้นที่ดิสก์ไม่ช่วยอะไร ตัวเลือกการกู้คืน:\n1. รัน `hermes {profile_arg}doctor --fix`\n2. หยุดเกตเวย์ แล้วกู้คืนด้วย:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (ถ้ารายงานว่ากู้คืนได้) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — การกู้คืนจะสำรองไฟล์ที่เสียหายก่อน ห้ามรัน `sqlite3 ... \".recover\"` กับ state.db ที่กำลังทำงานอยู่ เพราะ sqlite3 CLI ที่มีช่องโหว่อาจทำให้เสียหายมากกว่านี้\n3. กู้คืนจากสำเนาสำรองใน {backups_dir}/\nจากนั้นส่งข้อความของคุณอีกครั้ง"
    fts_index: 'เทิร์นนี้หยุดลงเพราะดัชนีการค้นหาของเซสชัน (FTS5) เสียหายและถอดออกไม่ได้ ข้อความนี้จึงไม่ได้ถูกบันทึก ตัวเก็บข้อความเองไม่เสียหาย: ห้ามรันเครื่องมือกู้คืนหรือกู้คืนจากสำเนาสำรอง รัน `hermes {profile_arg}doctor --fix` (หรือรีสตาร์ท Hermes ซึ่งจะซ่อมดัชนีตอนเปิด) แล้วส่งข้อความของคุณอีกครั้ง'
    disk: 'Hermes บันทึกบทสนทนานี้ลงดิสก์ไม่ได้ จึงหยุดทำงานแทนที่จะให้ข้อความของคุณหาย ดิสก์อาจจะเต็ม: คืนพื้นที่ว่าง (หรือแก้ไขสิทธิ์ของ {home}/state.db) แล้วส่งข้อความของคุณอีกครั้ง'
    default: 'Hermes บันทึกบทสนทนานี้ไม่ได้ จึงหยุดทำงานแทนที่จะให้ข้อความของคุณหาย สาเหตุที่เป็นไปได้: ไดรฟ์เต็มพื้นที่ หรือโพรเซส Hermes อื่นกำลังถือฐานข้อมูลอยู่ ปิดหน้าต่าง Hermes อื่น ๆ รัน `hermes {profile_arg}doctor` เพื่อตรวจสอบที่จัดเก็บข้อมูล แล้วส่งข้อความของคุณอีกครั้ง'
