    new_header: "เริ่มเซสชัน Hermes ใหม่ในท็อปปิกนี้แล้ว\n\nเคล็ดลับ: สำหรับงานแบบขนาน ให้เปิด All Messages แล้วส่งข้อความที่นั่นเพื่อสร้างท็อปปิกแยกต่างหาก แทนการใช้ /new ที่นี่ /new จะแทนเซสชันที่ผูกกับท็อปปิกปัจจุบัน"
    help: "/topic — เปิดโหมด DM หลายเซสชัน (บอทเดียว แชทขนานได้หลายอัน)\n\nการใช้งาน:\n  /topic             เปิดโหมดท็อปปิก หรือแสดงสถานะหากเปิดอยู่แล้ว\n  /topic help        แสดงข้อความนี้\n  /topic off         ปิดโหมดท็อปปิกและล้างการผูกท็อปปิก\n  /topic <id>        ภายในท็อปปิก: กู้คืนเซสชันก่อนหน้าด้วย ID\n\nวิธีทำงาน:\n1. รัน /topic ครั้งเดียวใน DM นี้ — Hermes จะตรวจสอบว่าการตั้งค่า Threads ของ BotFather เปิดอยู่\n   แล้วเปิดโหมดหลายเซสชัน\n2. แตะ All Messages ที่ด้านบนของบอท แล้วส่งข้อความใดก็ได้\n   Telegram จะสร้างท็อปปิกใหม่สำหรับข้อความนั้น แต่ละท็อปปิก\n   เป็นเซสชัน Hermes อิสระ (ประวัติใหม่ บริบทใหม่)\n3. DM หลักจะกลายเป็นล็อบบี้ระบบ — ส่ง /topic, /status,\n   /help, /usage ที่นั่น พรอมต์ปกติส่งในท็อปปิก\n4. /new ในท็อปปิกจะรีเซ็ตเฉพาะเซสชันของท็อปปิกนั้น\n5. /topic <id> ในท็อปปิกจะกู้คืนเซสชันเก่าเข้ามาในท็อปปิกนั้น"
