    connection_interrupted: ⚠️ การเชื่อมต่อไปยังบริการโมเดล AI ขาดขาดกลางคำขอ — ปกติจะเป็นปัญหาชั่วคราว ใช้ /retry เพื่อลองใหม่ หากเกิดซ้ำ ให้รัน `hermes doctor` บนโฮสต์
    unreachable: ⚠️ ติดต่อบริการโมเดล AI ไม่ได้ในขณะนี้ — endpoint ของโมเดลที่ตั้งไว้อาจไม่ทำงานหรือติดต่อไม่ถึง รอสักครู่แล้วใช้ /retry หากยังคงเกิด ให้รัน `hermes doctor` บนโฮสต์
    connection_unknown: ⚠️ Hermes ติดต่อบริการโมเดล AI ไม่ได้ (ไม่มีรายละเอียดเพิ่มจาก SDK) ใช้ /retry เพื่อลองใหม่ หากยังคงเกิด ให้รัน `hermes doctor` บนโฮสต์
    context_overflow: ⚠️ บทสนทนานี้ยาวเกินไปจนฉันอ่านทั้งก้อนไม่ได้ ใช้ /compress เพื่อตัดประวัติ หรือ /new เพื่อเริ่มบทสนทนาใหม่
    usage_limit_resets: ⏱️ ถึงขีดจำกัดการใช้งานของบริการโมเดล AI แล้ว จะรีเซ็ตใน {window} ใช้ /retry หลังจากนั้น หรือ /model เพื่อสลับโมเดล
    provider_kept_failing: ⚠️ บริการโมเดล AI ล้มเหลวซ้ำ ๆ ใช้ /retry เพื่อลองใหม่ หรือ /model เพื่อสลับโมเดล รายละเอียดอยู่ในล็อกเกตเวย์ (`hermes logs`)
    session_storage_unavailable_disk: ⚠️ พื้นที่จัดเก็บเซสชันใช้ไม่ได้ชั่วคราว จึงหยุดเทิร์นนี้เพื่อปกป้องประวัติบทสนทนาของคุณ โปรดตรวจสอบพื้นที่ดิสก์ที่เหลือ แล้วส่งข้อความอีกครั้ง
    session_storage_unavailable: ⚠️ พื้นที่จัดเก็บเซสชันใช้ไม่ได้ชั่วคราว จึงหยุดเทิร์นนี้เพื่อปกป้องประวัติบทสนทนาของคุณ ข้อความของคุณน่าจะถูกบันทึกแล้ว — โปรดส่งอีกครั้งในไม่ช้า
    generic_failed: ⚠️ มีบางอย่างผิดพลาดและฉันตอบกลับนี้ไม่เสร็จ ใช้ /retry เพื่อลองใหม่ หรือ /new เพื่อเริ่มบทสนทนาใหม่ รายละเอียดทางเทคนิคอยู่ในล็อกเกตเวย์ (`hermes logs`)
    interrupted_before_start: ⚠️ ข้อความของคุณถูกขัดจังหวะก่อนเริ่มประมวลผล (อาจเนื่องจากการ /stop เมื่อเร็ว ๆ นี้) โปรดส่งอีกครั้ง
