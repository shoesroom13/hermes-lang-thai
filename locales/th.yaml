  t005: /rollback diff 2 แสดงตัวอย่างสิ่งที่เปลี่ยนไปตั้งแต่เช็กพอยต์ 2 โดยไม่กู้คืนอะไรเลย
  t006: /rollback 2 src/file.py กู้คืนไฟล์เดียวจากเช็กพอยต์ที่ระบุ
  t007: /title "my project" ตั้งชื่อเซสชัน — กลับมาทำต่อภายหลังด้วย /resume หรือ hermes -c
  t008: /resume ทำต่อจากจุดที่ค้างไว้ในเซสชันที่ตั้งชื่อไว้ก่อนหน้า
  t009: /queue <prompt> เก็บข้อความเข้าคิวสำหรับเทิร์นถัดไปโดยไม่ขัดจังหวะเทิร์นปัจจุบัน
  t010: /undo ลบการแลกเปลี่ยนข้อความล่าสุดระหว่างผู้ใช้กับผู้ช่วยออกจากบทสนทนา
  t011: /retry ส่งข้อความล่าสุดของคุณอีกครั้ง — มีประโยชน์เมื่อคำตอบของเอเจนต์ยังไม่ถูกใจ
  t012: '/verbose สลับการแสดงความคืบหน้าเครื่องมือ: off → new → all → verbose'
  t013: /reasoning high เพิ่มความลึกการคิดของโมเดล ส่วน /reasoning show แสดงผลการให้เหตุผล
  t014: /fast สลับการประมวลผลแบบลำดับความสำคัญเพื่อให้ API ตอบกลับเร็วขึ้น (ขึ้นอยู่กับผู้ให้บริการ)
  t015: /yolo ข้ามการขออนุมัติคำสั่งเสี่ยงทั้งหมดที่เหลือของเซสชันนี้
  t016: /model สลับโมเดลกลางเซสชันได้ — ลอง /model sonnet หรือ /model gpt-5
  t017: /model --global เปลี่ยนโมเดลค่าเริ่มต้นของคุณแบบถาวร
  t018: /personality pirate ตั้งบุคลิกสุดสนุก — มีตัวเลือกในตัว 14 แบบ ตั้งแต่ kawaii ถึง shakespeare
  t019: /skin เปลี่ยนธีมของ CLI — ลอง ares, mono, slate, poseidon หรือ charizard
  t020: /statusbar สลับแถบถาวรที่แสดงโมเดล โทเค็น เปอร์เซ็นต์บริบทที่ใช้ ค่าใช้จ่าย และระยะเวลา
  t021: /tools disable browser ปิดใช้งานเครื่องมือเบราว์เซอร์ชั่วคราวสำหรับเซสชันปัจจุบัน
  t022: /browser connect เชื่อมต่อเครื่องมือเบราว์เซอร์กับเบราว์เซอร์ตระกูล Chromium ที่เปิดอยู่ผ่าน CDP
  t023: /plugins แสดงรายการปลั๊กอินที่ติดตั้งและสถานะ
  t024: /cron จัดการงานตามกำหนดเวลา — ตั้งพรอมต์ซ้ำพร้อมส่งผลไปยังแพลตฟอร์มใดก็ได้
  t025: /reload-mcp โหลดการตั้งค่าเซิร์ฟเวอร์ MCP ใหม่ทันทีโดยไม่ต้องรีสตาร์ท
  t026: /usage แสดงการใช้งานโทเค็น รายละเอียดค่าใช้จ่าย และระยะเวลาเซสชัน
  t027: /insights แสดงข้อมูลวิเคราะห์การใช้งานย้อนหลัง 30 วัน
  t028: /paste ตรวจหาภาพในคลิปบอร์ดและแนบไปกับข้อความถัดไปของคุณ
  t029: /profile แสดงโปรไฟล์ที่กำลังใช้งานและโฮมไดเรกทอรีของมัน
  t030: /config แสดงการตั้งค่าปัจจุบันของคุณในพักตาเดียว
  t031: /stop หยุดโพรเซสเบื้องหลังทั้งหมดที่เอเจนต์สร้างขึ้น
  t032: '@file:path/to/file.py เอาเนื้อหาไฟล์ใส่เข้าข้อความของคุณโดยตรง'
  t033: '@file:main.py:10-50 เอาเฉพาะบรรทัด 10-50 ของไฟล์มาใส่'
  t034: '@folder:src/ เอารายการต้นไม้ไดเรกทอรีมาใส่'
  t035: '@diff เอาการเปลี่ยนแปลง git ที่ยังไม่ staged เข้าข้อความ'
  t036: '@staged เอาการเปลี่ยนแปลง git ที่ staged แล้วเข้าข้อความ (git diff --staged)'
  t037: '@git:5 เอา 5 คอมมิตล่าสุดพร้อมแพตช์เต็มเข้าข้อความ'
  t038: '@url:https://example.com ดึงเนื้อหาหน้าเว็บและเอาเข้าข้อความ'
  t039: พิมพ์ @ เพื่อเรียกการเติมเส้นทางไฟล์อัตโนมัติ — นำทางไปยังไฟล์ใดก็ได้แบบโต้ตอบ
  t040: 'รวมหลายการอ้างอิงได้: "ตรวจ @file:main.py และ @file:test.py ว่าสอดคล้องกันไหม"'
  t041: Alt+Enter ขึ้นบรรทัดใหม่สำหรับอินพุตหลายบรรทัด (Windows Terminal ดักจับ Alt+Enter — ให้ใช้ Ctrl+Enter แทน)
  t042: Ctrl+C ขัดจังหวะเอเจนต์ กดสองครั้งภายใน 2 วินาทีเพื่อบังคับออก
  t043: Ctrl+Z ส่ง Hermes ไปรออยู่ในพื้นหลัง — พิมพ์ fg ในเชลล์เพื่อทำต่อ
  t044: Tab ยืนยันข้อความ ghost ที่แนะนำอัตโนมัติ หรือเติมคำสั่งสแลชให้เต็ม
  t045: พิมพ์ข้อความใหม่ขณะเอเจนต์ทำงาน เพื่อขัดจังหวะและเปลี่ยนทิศทาง
  t046: Alt+V วางภาพจากคลิปบอร์ดเข้าสู่บทสนทนา
  t047: การวางข้อความ 5 บรรทัดขึ้นไปจะบันทึกลงไฟล์อัตโนมัติ แล้วแทรกการอ้างอิงแบบกระชับแทน
  t048: hermes -c ทำต่อเซสชัน CLI ล่าสุดของคุณ ส่วน hermes -c "project name" ทำต่อตามชื่อเซสชัน
  t049: hermes -w สร้าง git worktree แยกอิสระ — เหมาะกับเวิร์กโฟลว์เอเจนต์แบบขนาน
  t050: 'hermes -w -q "Fix issue #42" รวมการแยก worktree กับคิวรีช็อตเดียว'
  t051: hermes chat -t web,terminal เปิดใช้เฉพาะชุดเครื่องมือที่กำหนดเพื่อเซสชันที่โฟกัส
  t052: hermes chat -s github-pr-workflow โหลดสกิลไว้ล่วงหน้าเมื่อเปิดตัว
  t053: hermes chat -q "query" รันคิวรีชุดเดียวแบบไม่โต้ตอบแล้วจบการทำงาน
  t054: hermes chat --max-turns 1000 เปลี่ยนขีดจำกัดค่าเริ่มต้น 500 รอบต่อเทิร์น
  t055: hermes chat --checkpoints เปิดสแนปช็อตไฟล์ระบบก่อนทุกการแก้ไขไฟล์ที่ทำลายข้อมูล
  t056: hermes --yolo ข้ามการขออนุมัติคำสั่งเสี่ยงทั้งหมดตลอดเซสชัน
  t057: hermes chat --source telegram ใส่แท็กเซสชันเพื่อกรองใน hermes sessions list
  t058: hermes -p work chat รันภายใต้โปรไฟล์ที่ระบุโดยไม่เปลี่ยนค่าเริ่มต้นของคุณ
  t059: hermes doctor --fix ตรวจวินิจฉัยและซ่อมแซมปัญหาการตั้งค่าและการพึ่งพิงอัตโนมัติ
  t060: hermes dump แสดงสรุปการตั้งค่าแบบกระชับ — เหมาะมากสำหรับรายงานบัก
  t061: hermes config set KEY VALUE ส่งซีเคร็ตไป .env และที่เหลือไป config.yaml อัตโนมัติ
  t062: hermes config edit เปิด config.yaml ในเอดิเตอร์ค่าเริ่มต้นของคุณ
  t063: hermes config check ตรวจหาตัวเลือกการตั้งค่าที่ขาดหายหรือล้าสมัย
  t064: hermes sessions browse เปิดตัวเลือกเซสชันแบบโต้ตอบพร้อมค้นหา
  t065: hermes sessions stats แสดงจำนวนเซสชันแยกตามแพลตฟอร์มและขนาดฐานข้อมูล
  t066: hermes sessions prune --older-than 30 ล้างเซสชันเก่าออก
  t067: hermes skills search react --source skills-sh ค้นหาในไดเรกทอรีสาธารณะ skills.sh
  t068: hermes skills check ตรวจสกิลจากฮับที่ติดตั้งเพื่อหาอัปเดตต้นทาง
  t069: hermes skills tap add myorg/skills-repo เพิ่มแหล่งสกิล GitHub แบบกำหนดเอง
  t070: hermes skills snapshot export setup.json ส่งออกการตั้งค่าสกิลของคุณเพื่อสำรองหรือแชร์
  t071: hermes mcp add github --command npx เพิ่มเซิร์ฟเวอร์ MCP จากบรรทัดคำสั่ง
  t072: hermes mcp serve รัน Hermes เองเป็นเซิร์ฟเวอร์ MCP สำหรับเอเจนต์ตัวอื่น
  t073: hermes auth add ให้คุณเพิ่ม API หลายคีย์เพื่อสลับใช้แบบ credential pool
  t074: hermes completion bash >> ~/.bashrc เปิดการเติมคำสั่งด้วย Tab สำหรับทุกคำสั่งและโปรไฟล์
  t075: hermes logs -f ติดตาม agent.log แบบเรียลไทม์ ส่วน --level WARNING --since 1h กรองผลลัพธ์
  t076: hermes backup สร้างไฟล์ซิปสำรองทั้งโฮมไดเรกทอรี Hermes ของคุณ
  t077: hermes profile create coder สร้างโปรไฟล์แยกอิสระที่กลายเป็นคำสั่งของตัวเอง
  t078: hermes profile create work --clone คัดลอกการตั้งค่าและคีย์ปัจจุบันของคุณไปโปรไฟล์ใหม่
  t079: hermes update ซิงก์สกิลใหม่ที่มากับตัวโปรแกรมไปทุกโปรไฟล์อัตโนมัติ
  t080: hermes gateway install ติดตั้ง Hermes เป็นบริการระบบ (systemd/launchd)
  t081: hermes memory setup ให้คุณตั้งค่าผู้ให้บริการความทรงจำภายนอก (Honcho, Mem0 ฯลฯ)
  t082: hermes webhook subscribe สร้างเราส์เว็บฮุกที่ขับด้วยอีเวนต์พร้อมตรวจ HMAC
  t083: 'ประหยัดเงินได้: hermes tools ปิดเครื่องมือที่ไม่ใช้ ส่วน hermes skills config เลือกสกิลให้เหลือเท่าที่จำเป็น'
  t084: /reasoning low หรือ /reasoning minimal ลดความลึกการคิดต่ำกว่าค่าเริ่มต้น (medium) — ตอบเร็วกว่าและถูกกว่า
  t085: hermes models ส่งงาน vision การบีบอัด และงานช่วยไปยังโมเดลที่ถูกกว่า — ลดค่าโทเค็นเบื้องหลัง 85%+ โดยไม่ลดระดับโมเดลแชทหลักของคุณ
  t086: 'ตั้ง display.bell_on_complete: true ใน config.yaml เพื่อให้เสียงเตือนเมื่องานยาวเสร็จ'
  t087: 'ตั้ง display.streaming: true เพื่อเห็นโทเค็นปรากฏแบบเรียลไทม์ขณะโมเดลสร้างข้อความ'
  t088: 'ตั้ง display.show_reasoning: true เพื่อดูเหตุผลแบบคิดตามสายของโมเดล'
  t089: 'ตั้ง display.compact: true เพื่อลดช่องว่างในผลลัพธ์ให้ข้อมูลแน่นขึ้น'
  t090: 'ตั้ง display.busy_input_mode: queue เพื่อให้ข้อความเข้าคิวแทนการขัดจังหวะเอเจนต์ หรือ steer เพื่อแทรกกลางรันผ่าน /steer'
  t091: 'ตั้ง display.resume_display: minimal เพื่อข้ามการสรุปบทสนทนาเต็มตอนทำต่อเซสชัน'
  t092: 'ตั้ง compression.threshold: 0.50 เพื่อควบคุมจุดที่การบีบอัดอัตโนมัติทำงาน (ค่าเริ่มต้น: 50% ของบริบท)'
  t093: 'ตั้ง agent.max_turns: 1000 เพื่อให้เอเจนต์เรียกเครื่องมือได้หลายขั้นตอนต่อเทิร์นขึ้น'
  t094: 'ตั้ง file_read_max_chars: 200000 เพื่อเพิ่มเนื้อหาสูงสุดต่อการเรียก read_file'
  t095: 'ตั้ง approvals.mode: smart เพื่อให้ LLM อนุมัติคำสั่งที่ปลอดภัยและปฏิเสธคำสั่งเสี่ยงอัตโนมัติ'
  t096: ตั้ง fallback_model ใน config.yaml เพื่อสลับไปผู้ให้บริการสำรองอัตโนมัติเมื่อเกิดปัญหา
  t097: 'ตั้ง privacy.redact_pii: true เพื่อแฮช ID ผู้ใช้และหมายเลขโทรศัพท์ก่อนส่งให้ LLM'
  t098: 'ตั้ง browser.record_sessions: true เพื่อบันทึกเซสชันเบราว์เซอร์เป็นวิดีโอ WebM อัตโนมัติ'
  t099: 'ตั้ง worktree: true ใน config.yaml เพื่อสร้าง git worktree ทุกครั้ง (เทียบเท่า hermes -w)'
  t100: 'ตั้ง security.website_blocklist.enabled: true เพื่อบล็อกโดเมนที่ระบุไม่ให้เครื่องมือเว็บเข้าถึง'
  t101: 'ตั้ง cron.wrap_response: false เพื่อส่งผลลัพธ์ดิบของเอเจนต์โดยไม่มีส่วนหัว/ท้ายของ cron'
  t102: HERMES_TIMEZONE แทนโซนเวลาเซิร์ฟเวอร์ด้วยสตริงโซนเวลา IANA ใดก็ได้
  t103: 'การแทนตัวแปรสภาพแวดล้อมใช้ได้ใน config.yaml: ใช้รูปแบบ ${VAR_NAME}'
  t104: คำสั่งด่วนใน config.yaml รันคำสั่งเชลล์ทันทีโดยไม่ใช้โทเค็นเลย
  t105: นิยามบุคลิกแบบกำหนดเองได้ใน config.yaml ใต้ agent.personalities
  t106: provider_routing ควบคุมการเรียงลำดับผู้ให้บริการ การอนุญาต และการบล็อกบน OpenRouter
  t107: execute_code รันสคริปต์ Python ที่เรียกเครื่องมือ Hermes ได้ด้วยโค้ด — ผลลัพธ์ไม่เข้าบริบท
  t108: delegate_task เปิดซับเอเจนต์พร้อมกันได้ถึง 10 ตัวตามค่าเริ่มต้น (delegation.max_concurrent_children) โดยบริบทแยกกันสำหรับงานแบบขนาน
  t109: web_extract ใช้ได้กับ URL ของ PDF — ส่งลิงก์ PDF เข้าไป มันจะแปลงเป็น markdown
  t110: search_files ทำงานบน ripgrep และเร็วกว่า grep — ใช้แทน grep ในเทอร์มินัลได้เลย
  t111: patch ใช้กลยุทธ์จับคู่แบบ fuzz 9 แบบ ทำให้ความต่างของช่องว่างเล็กน้อยไม่ทำให้แก้ไขพลาด
  t112: patch รองรับรูปแบบ V4A สำหรับแก้หลายไฟล์ครั้งเดียวในคำสั่งเดียว
  t113: read_file แนะนำชื่อไฟล์ที่คล้ายกันเมื่อหาไฟล์ไม่เจอ
  t114: read_file ตัดข้อมูลซ้ำอัตโนมัติ — การอ่านไฟล์ที่ไม่เปลี่ยนอีกจะคืนสตับแบบเบา
  t115: browser_vision จับภาพหน้าจอแล้ววิเคราะห์ด้วย AI — ใช้ได้กับ CAPTCHA และเนื้อหาภาพ
  t116: browser_console ประเมินนิพจน์ JavaScript ได้ในบริบทของหน้าเว็บ
  t117: image_generate สร้างภาพด้วย FLUX 2 Pro พร้อมอัปสเกล 2x อัตโนมัติ
  t118: text_to_speech แปลงข้อความเป็นเสียง — เล่นเป็นบับเบิลเสียงบน Telegram
  t119: send_message ส่งไปยังแพลตฟอร์มข้อความที่เชื่อมต่อได้ทุกตัวจากภายในเซสชัน
  t120: เครื่องมือ todo ช่วยเอเจนต์ติดตามงานซับซ้อนหลายขั้นตอนตลอดเซสชัน
  t121: session_search ค้นหาข้อความเต็มในบทสนทนาที่ผ่านมาทั้งหมด
  t122: เอเจนต์บันทึกค่ากำหนด การแก้คำสั่ง และข้อเท็จจริงเกี่ยวกับสภาพแวดล้อมลงความทรงจำอัตโนมัติ
  t123: /moa ส่งพรอมต์ยากหนึ่งเดียวผ่านชุดโมเดล Mixture of Agents ที่คุณตั้งไว้
  t124: คำสั่งเทอร์มินัลรองรับโหมดพื้นหลังพร้อม notify_on_complete สำหรับงานที่รันนาน
  t125: โพรเซสพื้นหลังของเทอร์มินัลรองรับ watch_patterns เพื่อเตือนเมื่อเจอบรรทัดผลลัพธ์ที่กำหนด
  t126: 'เครื่องมือเทอร์มินัลรองรับแบ็กเอนด์ 6 แบบ: local, Docker, SSH, Modal, Daytona และ Singularity'
  t127: แต่ละโปรไฟล์มีการตั้งค่า API คีย์ ความทรงจำ เซสชัน สกิล และงาน cron ของตัวเอง
  t128: ชื่อโปรไฟล์กลายเป็นคำสั่งเชลล์ — hermes profile create coder จะสร้างคำสั่ง coder ขึ้นมา
  t129: hermes profile export coder -o backup.tar.gz สร้างไฟล์อาร์ไคฟ์โปรไฟล์ที่พกพาได้
  t130: ถ้าโปรไฟล์สองตัวแชร์โทเคนบอทกันโดยไม่ตั้งใจ เกตเวย์ตัวที่สองจะถูกบล็อกพร้อมข้อความผิดพลาดชัดเจน
  t131: เซสชันสร้างชื่ออธิบายอัตโนมัติหลังการแลกเปลี่ยนครั้งแรก — ไม่ต้องตั้งชื่อเอง
  t132: 'ชื่อเซสชันรองรับการสืบต่อ: my project → my project #2 → my project #3'
  t133: เมื่อออก Hermes จะพิมพ์คำสั่งทำต่อพร้อม ID เซสชันและสถิติ
  t134: hermes sessions export backup.jsonl ส่งออกเซสชันทั้งหมดเพื่อสำรองหรือวิเคราะห์
  t135: hermes -r SESSION_ID ทำต่อเซสชันในอดีตใดก็ได้ตาม ID
  t136: ความทรงจำจำเป็นสแนปช็อตที่แช่แข็ง — การเปลี่ยนแปลงจะโผล่ในพรอมต์ระบบตอนเริ่มเซสชันถัดไปเท่านั้น
  t137: รายการความทรงจำถูกสแกนหารูปแบบ prompt injection และการลักข้อมูลอัตโนมัติ
  t138: 'เอเจนต์มีคลังความทรงจำสองแห่ง: บันทึกส่วนตัว (~2200 ตัวอักษร) และโปรไฟล์ผู้ใช้ (~1375 ตัวอักษร)'
  t139: การแก้ที่คุณบอกเอเจนต์ (ว่าไม่ ต้องทำแบบนี้) มักถูกบันทึกลงความทรงจำอัตโนมัติ
  t140: สกิลในตัวมากกว่า 80 ตัว ครอบคลุม github, creative, mlops, productivity, research และอื่น ๆ
  t141: สกิลที่ติดตั้งทุกตัวกลายเป็นคำสั่งสแลชอัตโนมัติ — พิมพ์ / เพื่อดูทั้งหมด
  t142: hermes skills install official/security/1password ติดตั้งสกิลเสริมจากรีโป
  t143: สกิลจำกัดเฉพาะแพลตฟอร์ม OS ได้ — บางตัวโหลดบน macOS หรือ Linux เท่านั้น
  t144: skills.external_dirs ใน config.yaml ให้โหลดสกิลจากไดเรกทอรีที่กำหนดเองได้
  t145: เอเจนต์สร้างสกิลของตัวเองเป็นความทรงจำเชิงขั้นตอนได้ด้วย skill_manage
  t146: /plan เขียนแผนนำไปปฏิบัติเป็น markdown ลง .hermes/plans/ โดยไม่รันอะไรเลย
  t147: 'งาน cron แนบสกิลได้: hermes cron add --skill blogwatcher "Check for new posts"'
  t148: เป้าหมายส่งของ cron รวม telegram, discord, slack, email, sms และแพลตฟอร์มอื่นอีก 12+ แบบ
  t149: ถ้าผลตอบของ cron ขึ้นต้นด้วย [SILENT] การส่งจะถูกระงับ — มีประโยชน์กับงานเฝ้าดูอย่างเดียว
  t150: Cron รองรับความล่าช้าแบบสัมพัทธ์ (30m) ช่วงเวลา (every 2h) นิพจน์ cron และเวลารูปแบบ ISO
  t151: งาน cron รันในเซสชันเอเจนต์ที่ใหม่สนิท — พรอมต์ต้องอธิบายตัวเองได้ครบ
  t152: โหมดเสียงใช้ได้โดยไม่ต้องมี API คีย์เลย ถ้าติดตั้ง faster-whisper (แปลงเสียงเป็นข้อความในเครื่องฟรี)
  t153: 'มีผู้ให้บริการ TTS ห้าแบบ: Edge TTS (ฟรี), ElevenLabs, OpenAI, NeuTTS (ในเครื่องฟรี), MiniMax'
  t154: /voice on เปิดโหมดเสียงใน CLI ส่วน Ctrl+B สลับการบันทึกแบบกดค้างเพื่อพูด
  t155: สตรีมมิ่ง TTS เล่นทีละประโยคขณะสร้าง — ไม่ต้องรอให้ตอบจบทั้งหมด
  t156: ข้อความเสียงบน Telegram, Discord, WhatsApp และ Slack ถูกแปลงเป็นข้อความอัตโนมัติ
  t157: 'Hermes รันบนแพลตฟอร์มข้อความ 21 แบบ: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, อีเมล และอื่น ๆ'
  t158: hermes gateway install ติดตั้งเป็นบริการระบบที่เริ่มทำงานตอนบูต
  t159: DingTalk ใช้ Stream Mode — ไม่ต้องมีเว็บฮุกหรือ URL สาธารณะ
  t160: BlueBubbles เชื่อม iMessage เข้า Hermes ผ่านเซิร์ฟเวอร์ macOS ในเครื่อง
  t161: เราส์เว็บฮุกรองรับการตรวจ HMAC การจำกัดอัตรา และการกรองอีเวนต์
  t162: เซิร์ฟเวอร์ API เปิดเอ็นด์พอยท์ที่เข้ากันได้กับ OpenAI ใช้งานกับ Open WebUI และ LibreChat ได้
  t163: 'โหมดช่องเสียง Discord: บอทเข้าห้อง VC รับเสียงพูดและพูดตอบกลับ'
  t164: 'group_sessions_per_user: true ให้แต่ละคนมีเซสชันของตัวเองในแชทกลุ่ม'
  t165: /sethome กำหนดแชทเป็นช่องทางหลักสำหรับส่งผลงาน cron
  t166: เกตเวย์รองรับการหมดเวลาตามความไม่เคลื่อนไหว — เอเจนต์ที่ยังทำงานอยู่รันได้ไม่จำกัด
  t167: 'การอนุมัติคำสั่งเสี่ยงมี 4 ระดับ: once, session, always (อนุญาตถาวร), deny'
  t168: โหมดอนุมัติอัจฉริยะใช้ LLM อนุมัติคำสั่งปลอดภัยอัตโนมัติและตั้งแฟล็กคำสั่งเสี่ยง
  t169: การป้องกัน SSRF บล็อกเครือข่ายส่วนตัว ลูปแบ็ก ลิงก์โลคัล และที่อยู่เมทาดาต้าคลาวด์
  t170: ID เซสชันขึ้นต้นด้วยเวลาประทับ (20250305_091523_abcd) ทำให้เรียงลำดับใน ls และ jq ได้เอง
  t171: ซับโพรเซสของ MCP ได้สภาพแวดล้อมที่กรองแล้ว — มีเฉพาะตัวแปรระบบที่ปลอดภัยผ่านไป
  t172: ไฟล์บริบท (.hermes.md, AGENTS.md) ถูกสแกนความปลอดภัยหารูปแบบ prompt injection ก่อนโหลด
  t173: command_allowlist ใน config.yaml อนุญาตรูปแบบคำสั่งเชลล์ที่ระบุแบบถาวร
  t174: บริบทบีบอัดอัตโนมัติเมื่อถึงขีดจำกัด — ความทรงจำถูกฟลัชและประวัติถูกสรุป
  t175: แถบสถานะเปลี่ยนเป็นสีเหลือง ส้ม แล้วแดงตามที่บริบทเต็ม
  t176: SOUL.md คือไฟล์อัตลักษณ์หลักของเอเจนต์ — แก้ไขมันเพื่อกำหนดพฤติกรรม
  t177: Hermes โหลดบริบทโปรเจกต์จาก .hermes.md, AGENTS.md, CLAUDE.md หรือ .cursorrules (ตัวแรกที่เจอ)
  t178: ไฟล์ AGENTS.md ในซับไดเรกทอรีถูกค้นพบทีละขั้นเมื่อเอเจนต์วนเข้าโฟลเดอร์
  t179: ไฟล์บริบทจำกัดไว้ 20,000 ตัวอักษร โดยตัดส่วนหัว/ท้ายอย่างชาญฉลาด
  t180: 'มีผู้ให้บริการเบราว์เซอร์ห้าแบบ: local Chromium, Browserbase, Browser Use, Camofox และ Firecrawl'
  t181: Camofox เป็นเบราว์เซอร์ต่อต้านการตรวจจับ — ฟอร์กจาก Firefox พร้อมปลอมฟิงเกอร์ปรินต์ด้วย C++
  t182: browser_navigate คืนสแนปช็อตหน้าเว็บอัตโนมัติ — ไม่ต้องเรียก browser_snapshot ต่อ
  t183: browser_vision เมื่อ annotate=true จะวางป้ายเลขลงบนองค์ประกอบที่โต้ตอบได้
  t184: hermes mcp เปิดตัวเลือก MCP ที่ Nous อนุมัติแบบโต้ตอบ ติดตั้งได้ในแป้นเดียว
  t185: hermes mcp catalog แสดงรายการเซิร์ฟเวอร์ MCP ที่ Nous อนุมัติและมากับรีโป
  t186: hermes mcp install <name> ติดตั้งรายการจากคาตาล็อก ถามข้อมูลรับรอง และให้คุณเลือกเปิดเครื่องมือใด
  t187: เซิร์ฟเวอร์ MCP ตั้งค่าใน config.yaml — รองรับทั้งทรานสปอร์ต stdio และ HTTP
  t188: 'กรองเครื่องมือต่อเซิร์ฟเวอร์ได้: tools.include อนุญาต และ tools.exclude บล็อกเครื่องมือที่ระบุ'
  t189: เซิร์ฟเวอร์ MCP สร้างชุดเครื่องมือขณะรันอัตโนมัติ — ใช้ hermes tools สลับได้แยกตามแพลตฟอร์ม
  t190: 'MCP รองรับ OAuth: auth: oauth เปิดการอนุญาตผ่านเบราว์เซอร์ด้วย PKCE'
  t191: เช็กพอยต์ไม่มีค่าโอเวอร์เฮดเลยเมื่อไม่มีการแก้ไขไฟล์ — เปิดใช้ตามค่าเริ่มต้น
  t192: สแนปช็อตก่อนย้อนกลับถูกบันทึกอัตโนมัติ เพื่อให้คุณย้อนการย้อนกลับได้
  t193: /rollback ย้อนเทิร์นบทสนทนาด้วย เอเจนต์จึงไม่จำสิ่งที่ย้อนกลับไป
  t194: เช็กพอยต์ใช้รีโปเงาใน ~/.hermes/checkpoints/ — ไม่แตะ .git ของโปรเจกต์คุณเลย
  t195: batch_runner.py ประมวลผลพรอมต์เป็นร้อยตัวแบบขนานเพื่อสร้างข้อมูลฝึก
  t196: hermes chat -Q เปิดโหมดเงียบสำหรับใช้แบบโปรแกรม — ซ่อนแบนเนอร์และสปินเนอร์
  t197: การบันทึก trajectory (--save-trajectories) เก็บร่องรอยการใช้เครื่องมือทั้งหมดเพื่อฝึกโมเดล
  t198: 'ปลั๊กอินมีสามแบบ: ทั่วไป (tools/hooks) ผู้ให้บริการความทรงจำ และเอนจินบริบท'
  t199: hermes plugins install owner/repo ติดตั้งปลั๊กอินจาก GitHub โดยตรง
  t200: 'ผู้ให้บริการความทรงจำภายนอก: Honcho, Hindsight, Mem0, OpenViking และอื่น ๆ ติดตั้งผ่าน hermes plugins install'
  t201: ฮุกของปลั๊กอินมี pre/post_tool_call, pre/post_llm_call และ transform_terminal_output สำหรับทำให้ผลลัพธ์เป็นมาตรฐาน
  t202: การแคชพรอมต์ (Anthropic) ลดค่าใช้จ่ายด้วยการนำคำนำพรอมต์ระบบที่แคชไว้มาใช้ซ้ำ
  t203: เอเจนต์สร้างชื่อเซสชันอัตโนมัติในเธรดพื้นหลัง — ไม่กระทบลatency เลย
  t204: การกำหนดเส้นทางโมเดลอัจฉริยะส่งคิวรีง่ายไปโมเดลที่ถูกกว่าได้เอง
  t205: 'คำสั่งสแลชรองรับการจับคู่คำนำ: /h เข้าใจว่า /help ส่วน /mod เข้าใจว่า /model'
  t206: การลากเส้นทางไฟล์เข้าตerminal จะแนบภาพหรือส่งเป็นบริบทอัตโนมัติ
  t207: .worktreeinclude ที่รูตรีโประบุไฟล์ที่ถูก gitignore ให้คัดลอกเข้า worktree
  t208: hermes acp รัน Hermes เป็นเซิร์ฟเวอร์ ACP สำหรับเชื่อมกับ VS Code, Zed และ JetBrains
  t209: 'ผู้ให้บริการแบบกำหนดเอง: บันทึกเอ็นด์พอยท์ที่มีชื่อใน config.yaml ใต้ custom_providers'
  t210: HERMES_EPHEMERAL_SYSTEM_PROMPT แทรกพรอมต์ระบบที่ไม่ถูกบันทึกลงประวัติเลย
  t211: credential_pool_strategies รองรับการสลับแบบ fill_first, round_robin, least_used และ random
  t212: hermes auth add nous หรือ hermes auth add openai-codex ตั้งผู้ให้บริการแบบ OAuth
  t213: เซิร์ฟเวอร์ API รองรับทั้ง Chat Completions และ Responses API พร้อมสถานะฝั่งเซิร์ฟเวอร์
  t214: 'tool_preview_length: 0 ใน config แสดงเส้นทางไฟล์เต็มในฟีดกิจกรรมของสปินเนอร์'
  t215: hermes status --deep รันการตรวจวินิจฉัยลึกขึ้นทั่วทุกคอมโพเนนต์
  t216: งาน cron แนบสคริปต์ Python (--script) ได้ โดย stdout ของมันถูกแทรกเข้าพรอมต์เป็นบริบท
  t217: สคริปต์ cron อยู่ที่ ~/.hermes/scripts/ และรันก่อนเอเจนต์ — เหมาะกับไปป์ไลน์เก็บข้อมูล
  t218: prefill_messages_file ใน config.yaml แทรกตัวอย่าง few-shot ทุกการเรียก API โดยไม่บันทึกลงประวัติ
  t219: SOUL.md แทนอัตลักษณ์เริ่มต้นของเอเจนต์ทั้งหมด — เขียนใหม่เพื่อทำให้ Hermes เป็นของคุณ
  t220: SOUL.md ถูกรองบุคลิกเริ่มต้นไว้ตอนรันครั้งแรก แก้ไขมันเพื่อปรับแต่ง
  t221: /compress <focus topic> จัดงบสรุป 60-70% ให้หัวข้อของคุณและตัดที่เหลืออย่างเข้มงวด
  t222: ตั้งแต่การบีบอัดครั้งที่สอง ตัวบีบอัดจะอัปเดตสรุปเดิมแทนเริ่มใหม่ตั้งแต่ศูนย์
  t223: ก่อนรีเซ็ตเซสชันเกตเวย์ Hermes ฟลัชข้อเท็จจริงสำคัญลงความทรงจำในพื้นหลังอัตโนมัติ
  t224: 'network.force_ipv4: true ใน config.yaml แก้อาการค้างบนเซิร์ฟเวอร์ที่ IPv6 พัง — มัน monkey-patch socket'
  t225: 'เครื่องมือเทอร์มินัลอธิบาย exit code ทั่วไป: grep คืน 1 แปลว่าไม่พบข้อความที่ค้นหา (ไม่ใช่ข้อผิดพลาด)'
  t226: คำสั่งเทอร์มินัลเบื้องหน้าที่พลาดจะลองใหม่อัตโนมัติสูงสุด 3 ครั้ง โดยหน่วงแบบเอกซ์โพเนนเชียล (2s, 4s, 8s)
  t227: คำสั่ง sudo ล้วนถูกเขียนใหม่ให้ไพป์ SUDO_PASSWORD จาก .env อัตโนมัติ — ไม่ต้องตอบพรอมต์โต้ตอบ
  t228: 'เฮลเปอร์ของ execute_code ต้อง import เอง: from hermes_tools import json_parse, shell_quote, retry'
  t229: เครื่องมือแซนด์บ็อกซ์ 7 ตัวของ execute_code (web_search, terminal, read/write/search/patch) ใช้ RPC — ไม่เข้าบริบทเลย
  t230: การอ่านบริเวณไฟล์เดิม 3 ครั้งขึ้นไปจะเกิดคำเตือน ที่ 4 ครั้งขึ้นไปถูกบล็อกแน่นอนเพื่อกันวนซ้ำ
  t231: write_file และ patch ตรวจพบถ้าไฟล์ถูกแก้จากภายนอกหลังอ่านครั้งล่าสุดและเตือนว่าข้อมูลล้าสมัย
  t232: รูปแบบแพตช์ V4A รองรับคำสั่ง Add File, Delete File และ Move File — ไม่ใช่แค่ Update
  t233: เซิร์ฟเวอร์ MCP ขอผลการเติมข้อความจาก LLM ผ่าน sampling ได้ — เอเจนต์กลายเป็นเครื่องมือให้เซิร์ฟเวอร์
  t234: เซิร์ฟเวอร์ MCP ส่ง notifications/tools/list_changed เพื่อเรียกการลงทะเบียนเครื่องมือใหม่อัตโนมัติโดยไม่รีสตาร์ท
  t235: delegate_task เมื่อ acp_command เป็น claude จะสปอน Claude Code เป็นซับเอเจนต์จากแพลตฟอร์มใดก็ได้
  t236: การมอบหมายงานมีเธรดฮีตบีต — กิจกรรมของลูกถ่ายต่อไปยังตัวแม่ ป้องกันไม่ให้เกตเวย์หมดเวลา
  t237: เมื่อผู้ให้บริการคืน HTTP 402 (ต้องชำระเงิน) ไคลเอนต์ตัวช่วยจะสลับไปตัวถัดไปอัตโนมัติ
  t238: agent.tool_use_enforcement ขับโมเดลที่บรรยายการกระทำแทนการเรียกเครื่องมือ — เปิดอัตโนมัติสำหรับ GPT/Codex
  t239: agent.restart_after_turn_timeout ให้เทิร์นที่กำลังทำงานจบก่อน /restart จะเข้าสู่ stop() ส่วน restart_drain_timeout เป็นงบบังคับขัดจังหวะเมื่อ stop() เริ่มแล้วเท่านั้น
  t240: agent.api_max_retries (ค่าเริ่มต้น 3) ควบคุมจำนวนครั้งที่เอเจนต์ลองเรียก API ที่พลาดอีกครั้งก่อนแสดงข้อผิดพลาด — ลดลงเพื่อสลับสำรองเร็วขึ้น
  t241: เกตเวย์แคชอินสแตนซ์ AIAgent ต่อเซสชัน — ล้างแคชนี้จะทำให้การแคชพรอมต์ของ Anthropic พัง
  t242: เว็บไซต์ใดก็เปิดเผยสกิลผ่าน /.well-known/skills/index.json ได้ — ฮับสกิลจะค้นพบเองอัตโนมัติ
  t243: ล็อกตรวจสอบสกิลที่ ~/.hermes/skills/.hub/audit.log บันทึกทุกการติดตั้งและถอนการติดตั้ง
  t244: 'git worktree ที่ค้างเก่าถูก cleaned เองตอนสตาร์ทอัป: ต้นไม้ที่สะอาดและผสานครบจะถูกตัดทิ้ง งานสกปรกหรือยังไม่พุชจะถูกรักษาไว้เสมอ'
  t245: โปรไฟล์กำหนดขอบเขตสถานะ Hermes ผ่าน HERMES_HOME ส่วนซับโพรเซสเครื่องมือโฮสต์ยังใช้ HOME จริงของคุณ นอกจาก terminal.home_mode จะเป็น profile
  t246: ตัวแปรสภาพแวดล้อม HERMES_HOME_MODE (ฐานแปด เช่น 0701) กำหนดสิทธิ์ไดเรกทอรีแบบกำหนดเองสำหรับการเข้าถึงของเว็บเซิร์ฟเวอร์
  t247: 'โหมดคอนเทนเนอร์: วาง .container-mode ใน HERMES_HOME แล้ว CLI โฮสต์จะ exec เข้าคอนเทนเนอร์เอง'
  t248: 'Ctrl+C มีลำดับความสำคัญ 5 ขั้น: ยกเลิกการบันทึก → ยกเลิกพรอมต์ → ยกเลิกตัวเลือก → ขัดจังหวะเอเจนต์ → ออก'
  t249: การขัดจังหวะทุกครั้งขณะเอเจนต์ทำงานถูกบันทึกลง ~/.hermes/interrupt_debug.log พร้อมเวลาประทับ
  t250: BROWSER_CDP_URL เชื่อมเครื่องมือเบราว์เซอร์กับเบราว์เซอร์ตระกูล Chromium ที่เปิดอยู่ — รับ WebSocket, HTTP หรือ host:port
  t251: BROWSERBASE_ADVANCED_STEALTH=true เปิดการหลบเลี่ยงการตรวจจับขั้นสูงด้วย Chromium แบบกำหนดเอง (Scale Plan)
  t252: CLI สลับไปโหมดกระชับเองเมื่อเทอร์มินัลแคบกว่า 80 คอลัมน์
  t253: 'คำสั่งด่วนรองรับสองแบบ: exec (รันคำสั่งเชลล์ตรง ๆ) และ alias (เปลี่ยนทิศไปอีกคำสั่ง)'
  t254: 'โมเดลมอบหมายงานรายงานได้: delegation.model และ delegation.provider ใน config ส่งซับเอเจนต์ไปโมเดลที่ถูกกว่า'
  t255: delegation.reasoning_effort ควบคุมความลึกการคิดของซับเอเจนต์แยกได้เอง
  t256: 'display.platforms ใน config.yaml อนุญาตให้ปรับการแสดงผลแยกตามแพลตฟอร์มได้: {telegram: {tool_progress: all}}'
  t257: human_delay.mode ใน config จำลองความเร็วพิมพ์ของมนุษย์ — ปรับช่วง min_ms/max_ms ได้
  t258: การย้ายเวอร์ชัน config รันอัตโนมัติตอนโหลด — คีย์ config ใหม่โผล่ได้เองโดยไม่ต้องแก้อะไร
  t259: โมเดล GPT และ Codex ได้คำแนะนำพรอมต์ระบบพิเศษสำหรับวินัยการใช้เครื่องมือและการเรียกเครื่องมือบังคับ
  t260: โมเดล Gemini ได้คำสั่งเฉพาะเรื่องเส้นทางสัมบูรณ์ การเรียกเครื่องมือแบบขนาน และคำสั่งที่ไม่โต้ตอบ
  t261: context.engine ใน config.yaml ตั้งเป็นชื่อปลั๊กอินได้ เพื่อใช้กลยุทธ์จัดการบริบทแบบอื่น
  t262: สแนปช็อตหน้าเว็บที่เกิน 15,000 ตัวอักษรจะถูกตัดหรือสรุปอัตโนมัติ ส่วนสแนปช็อตเต็มถูกบันทึกลง cache/web เพื่ออ่านต่อด้วย read_file
  t263: 'ตัวบีบอัดทำพรีแพสแบบประหยัดก่อน: ผลลัพธ์เครื่องมือที่เกิน 200 ตัวอักษรจะถูกแทนด้วยตัวแทนข้อความก่อนที่ LLM จะทำงาน'
  t264: เมื่อการบีบอัดพลาด การพยายามครั้งถัดไปจะหยุดพัก 10 นาทีเพื่อไม่ให้ยิง API ถี่เกินไป
  t265: คำสั่งเสี่ยงที่ยาว (>70 ตัวอักษร) มีตัวเลือก view ในพรอมต์อนุมัติ เพื่อดูข้อความเต็มก่อน
  t266: การแสดงระดับเสียงใช้แท่ง ▁▂▃▄▅▆▇ ระหว่างบันทึกเสียง อ้างอิงจากระดับ RMS ของไมโครโฟน
  t267: ชื่อโปรไฟล์ห้ามซ้ำกับไบนารีใน PATH — hermes profile create ls จะถูกปฏิเสธ
  t268: hermes profile create backup --clone-all คัดลอกทุกอย่าง (config, keys, SOUL.md, memories, skills, sessions)
  t269: ปุ่มบันทึกเสียงตั้งได้ผ่าน voice.record_key ใน config.yaml — ไม่จำกัดแค่ Ctrl+B
  t270: ไฟล์ .cursorrules และ .cursor/rules/*.mdc ถูกตรวจพบและโหลดเป็นบริบทโปรเจกต์อัตโนมัติ
  t271: ไฟล์บริบทตรวตรูปแบบ prompt injection กว่า 10 แบบ — ยูนิโคดที่มองไม่เห็น คำว่า ignore instructions และความพยายามขโมยข้อมูล
  t272: GPT-5 และ Codex ใช้บทบาท developer แทน system ในรูปแบบข้อความ
  t273: 'ตัวช่วยปรับแต่งรายงานได้: auxiliary.vision.provider, auxiliary.compression.model ฯลฯ ใน config.yaml'
  t274: ไคลเอนต์ตัวช่วยถือว่า main คือนามแฝงผู้ให้บริการ — แปลว่าไปที่ผู้ให้บริการหลักและโมเดลจริงของคุณ
  t275: hermes claw migrate --dry-run แสดงตัวอย่างการย้ายจาก OpenClaw โดยไม่เขียนอะไรเลย
  t276: เส้นทางไฟล์ที่วางมาพร้อมเครื่องหมายคำพูดหรือช่องว่างที่ escape ถูกจัดการให้อัตโนมัติ — ไม่ต้องแก้เอง
  t277: คำสั่งสแลชไม่ทำให้การวางข้อความยาวถูกยุบ — /command พร้อมอาร์กิวเมนต์ใหญ่ทำงานได้ถูกต้อง
  t278: ในโหมดขัดจังหวะ คำสั่งสแลชที่พิมพ์ระหว่างเอเจนต์ทำงานจะข้ามลอจิกการขัดจังหวะและรันทันที
  t279: HERMES_DEV=1 ข้ามการตรวจจับโหมดคอนเทนเนอร์เพื่อการพัฒนาในเครื่อง
  t280: เซิร์ฟเวอร์ MCP แต่ละตัวมีชุดเครื่องมือของตัวเอง (mcp-servername) สลับแยกกันได้ผ่าน hermes tools
  t281: ตัวแทน ${ENV_VAR} ของ MCP ใน config ถูกเติมค่าตอนสปอนเซิร์ฟเวอร์ — รวมถึงตัวแปรจาก ~/.hermes/.env
  t282: สกิลจากรีโปที่เชื่อถือได้ (NousResearch) ได้ระดับความปลอดภัย trusted ส่วนสกิลชุมชนถูกสแกนเพิ่ม
  t283: พื้นที่กักกันสกิลที่ ~/.hermes/skills/.hub/quarantine/ เก็บสกิลที่รอตรวจความปลอดภัย
  t284: /steer <prompt> แทรกบันทึกหลังการเรียกเครื่องมือครั้งถัดไป — ปรับทิศกลางงานโดยไม่ขัดจังหวะ
  t285: /goal <text> ตั้งเป้าหมายถาวรแบบ Ralph-loop — Hermes ทำต่อเทิร์นต่อเทิร์นเองจนผู้ตัดสินบอกว่าจบ
  t286: /snapshot create [label] บันทึกสแนปช็อตสถานะเต็มของการตั้งค่า Hermes ส่วน /snapshot restore <id> กู้คืนภายหลัง
  t287: /copy [N] คัดลอกคำตอบล่าสุดของผู้ช่วยลงคลิปบอร์ด หรือตัวที่ N จากท้ายเมื่อระบุตัวเลข
  t288: /redraw บังคับวาด UI ใหม่ทั้งหมด แก้อาการหน้าจอเพี้ยนหลังปรับขนาด tmux หรือร่องจากการเลือกด้วยเมาส์
  t289: /agents (นามแฝง /tasks) แสดงเอเจนต์ที่ทำงานและงานพื้นหลังที่รันอยู่ในเซสชันปัจจุบัน
  t290: /footer สลับส่วนท้ายของเกตเวย์บนคำตอบสุดท้าย โดยแสดงโมเดล เปอร์เซ็นต์บริบท และ cwd
  t291: /busy queue|steer|interrupt ควบคุมว่ากด Enter ทำอะไรขณะ Hermes ทำงาน
  t292: /topic ใน Telegram DM เปิดโหมดท็อปิกหลายเซสชันที่ผู้ใช้จัดการเอง — /topic <id> กู้คืนเซสชันในอดีตได้ในเส้นแชท
  t293: /approve session|always รันคำสั่งเสี่ยงที่รออยู่ด้วยขอบเขตความเชื่อมั่นที่คุณเลือก ส่วน /deny ปฏิเสธมัน
  t294: /restart รีสตาร์ทเกตเวย์อย่างนุ่มนวลหลังปล่อยงานที่กำลังรันให้จบ แล้วปิงกลับผู้ร้องขอเมื่อพร้อมใช้
  t295: /kanban boards switch <slug> เปลี่ยนบอร์ด Kanban ข้ามโปรเจกต์ที่ใช้งานอยู่จากในแชท
  t296: /reload โหลด ~/.hermes/.env เข้าเซสชันที่รันอยู่ — ใช้ API คีย์ใหม่ได้โดยไม่ต้องรีสตาร์ท
  t297: cronjob ที่ no_agent=True รันสคริปต์ตามเวลาและส่ง stdout ตรง ๆ — ไม่ใช้โทเค็น ไม่ใช้ LLM
  t298: ถ้า stdout ของสคริปต์ cron ว่างเปล่า แปลว่าเตือนเงียบ — ไม่ส่งอะไรเลย เหมาะกับงานเฝ้าขีดจำกัด
  t299: HERMES_CRON_MAX_PARALLEL (ค่าเริ่มต้น 4) จำกัดจำนวนงาน cron ที่รันต่องวด เพื่อไม่ให้พีคค้างคีย์ของคุณ
  t300: ฮุกเกตเวย์อยู่ที่ ~/.hermes/hooks/<name>/ มี HOOK.yaml + handler.py — ตัวจัดการต้องตั้งชื่อว่า handle
  t301: อีเวนต์ฮุกมี gateway:startup, session:start, agent:step และการสมัครไวด์การ์ด command:*
  t302: วางเช็กลิสต์ ~/.hermes/BOOT.md ไว้ ฮุก gateway:startup จะสั่งรันมันเป็นเอเจนต์ช็อตเดียวทุกครั้งที่บูต
  t303: hermes curator run --dry-run แสดงตัวอย่างว่าตัว curator จะเก็บเข้าคลังหรือรวมอะไร โดยไม่แก้ไขอะไรเลย
  t304: hermes curator pin <skill> กักสกิลไว้แน่น ไม่ให้เข้าคลังอัตโนมัติและกันเครื่องมือ skill_manage ของเอเจนต์
  t305: hermes curator rollback กู้คืนสกิลจากสแนปช็อตก่อนรัน — สำรองอยู่ใต้ skills/.curator_backups/
  t306: hermes auth reset <provider> [target] ล้างเวลาคูลดาวน์และแฟล็กหมดอายุของทั้ง credential pool หรือของหนึ่งข้อมูลรับรอง ตาม index, id หรือ label
  t307: 'credential_pool_strategies.<provider>: round_robin ไล่คีย์อย่างเท่าเทียมแทนค่าเริ่มต้น fill_first'
  t308: 'use_gateway: true ต่อเครื่องมือ ส่งงาน web, image, tts หรือ browser ผ่านการสมัคร Nous ของคุณ — ไม่ต้องมีคีย์เสริม'
  t309: 'provider_routing.data_collection: deny ตัดผู้ให้บริการที่เก็บข้อมูลบน OpenRouter ออก'
  t310: 'provider_routing.require_parameters: true ส่งเฉพาะไปผู้ให้บริการที่รองรับทุกพารามิเตอร์ในคำขอของคุณ'
  t311: HERMES_TUI_RESUME=1 แนบกลับเซสชัน TUI ล่าสุดเองตอนเปิดตัว — สะดวกเวลา SSH หลุด
  t312: HERMES_TUI_THEME=light|dark|<hex> บังคับธีม TUI บนเทอร์มินัลที่ไม่ตั้ง COLORFGBG
  t313: Ctrl+G หรือ Ctrl+X Ctrl+E ใน TUI เปิดบัฟเฟอร์อินพุตใน $EDITOR สำหรับพรอมต์ยาวหลายบรรทัด
  t314: TUI เรนเดอร์ LaTeX ในบรรทัด — $E=mc^2$ กลายเป็นสัญกรณ์คณิตยูนิโคด ไม่ใช่ TeX ดิบ
  t315: hermes dashboard เปิดเว็บ UI ในเครื่องที่ 127.0.0.1:9119 — ไม่มีข้อมูลออกจาก localhost เลย
  t316: hermes dashboard ฝัง TUI ของ Hermes ทั้งหมดในเบราว์เซอร์คุณผ่าน xterm.js และ WebSocket PTY
  t317: วางไฟล์ YAML ใน ~/.hermes/dashboard-themes/ โดยมีสีพาเลตสองสีเพื่อเปลี่ยนลุกได้ทั้งแดชบอร์ด
  t318: 'ปลั๊กอินแดชบอร์ดวางก็ใช้ได้: manifest.json + JS bundle ใน ~/.hermes/dashboard-plugins/ — ไม่ต้อง build ด้วย npm'
  t319: 'layoutVariant: cockpit ในธีมแดชบอร์ดเพิ่มรางซ้าย 260px ที่ปลั๊กอินเติมเนื้อได้ผ่านสล็อต sidebar'
  t320: 'display.tool_progress_command: true เปิด /verbose บนแพลตฟอร์มข้อความ ซึ่งปกติใช้ได้แค่ใน CLI'
  t321: HERMES_BACKGROUND_NOTIFICATIONS=result ปิงเฉพาะเมื่องานพื้นหลังจบ (เทียบกับ concise/all/error/off)
  t322: 'HERMES_WRITE_SAFE_ROOT จำกัด write_file/patch ให้อยู่ในคำนำไดเรกทอรีที่กำหนด หลายเส้นทางคั่นด้วย os.pathsep (: หรือ ;)'
  t323: HERMES_IGNORE_RULES ข้ามการแทรกอัตโนมัติของ AGENTS.md, SOUL.md, .cursorrules ความทรงจำ และสกิลที่โหลดไว้
  t324: HERMES_ACCEPT_HOOKS อนุมัติเชลล์ฮุกใหม่ที่ประกาศใน config.yaml โดยไม่ต้องตอบพรอมต์ผ่าน TTY
  t325: auxiliary.goal_judge.model ส่งผู้ตัดสินของ /goal ไปโมเดลที่ถูกและเร็ว เพื่อให้ค่าลูปใกล้ศูนย์
  t326: เช็กพอยต์ข้ามไดเรกทอรีที่มีไฟล์เกิน 50,000 ไฟล์ เพื่อไม่ให้ git ช้าบนมอนอรีโปยักษ์
  t327: 'tts.provider: piper รัน TTS ในเครื่อง 44 ภาษา บน CPU — เสียงดาวน์โหลดอัตโนมัติลง ~/.hermes/cache/piper-voices/'
  t328: 'tts.providers.<name>.type: command ต่อเอนจิน TTS แบบ CLI ใดก็ได้ โดยใช้ตัวแทน {input_path} และ {output_path}'
  t329: API_SERVER_ENABLED=true รันเอ็นด์พอยท์ที่เข้ากันได้กับ OpenAI คู่กับเกตเวย์ สำหรับ Open WebUI และ LibreChat
  t330: 'GATEWAY_PROXY_URL รันแบบแยกส่วน: I/O ของแพลตฟอร์มในเครื่อง งานเอเจนต์ส่งต่อไปเซิร์ฟเวอร์ API ระยะไกล'
  t331: MATRIX_DEVICE_ID ปัก device ID คงที่สำหรับ E2EE — ถ้าไม่มี คีย์จะหมุนทุกครั้งที่เริ่มและถอดรหัสประวัติจะพัง
  t332: TELEGRAM_WEBHOOK_SECRET จำเป็นทุกครั้งที่ตั้ง TELEGRAM_WEBHOOK_URL — สร้างด้วย openssl rand -hex 32
  t333: batch_runner.py --resume จับคู่พรอมต์ที่ทำเสร็จด้วยเนื้อความ ทำให้การเรียงชุดข้อมูลใหม่ไม่ทำให้รันงานซ้ำ
  t334: /new เริ่มเซสชันใหม่ทันทีที่เดิม (นามแฝง /reset) — ได้ ID เซสชันใหม่ ประวัติสะอาด CLI ยังเปิดอยู่
  t335: /clear ล้างหน้าจอเทอร์มินัลและเริ่มเซสชันใหม่พร้อมกัน — สั้น cut เดียวรีเซ็ตทั้งภาพทั้งเซสชัน
  t336: /history พิมพ์บทสนทนาปัจจุบันออกหน้าจอโดยไม่ออกจาก CLI — สะดวกสำหรับอ่านด่วนซ้ำ
  t337: /save บันทึกบทสนทนาปัจจุบันลงดิสก์โดยไม่จบเซสชัน
  t338: '/status แสดงข้อมูลเซสชันในพักตาเดียว: ID, หัวข้อ, โมเดล, การใช้โทเค็น และเวลาที่ผ่านไป'
  t339: /image <path> แนบไฟล์ภาพในเครื่องสำหรับพรอมต์ถัดไป โดยไม่ต้องวางหรือลากมาวาง
  t340: /platforms แสดงสถานะการเชื่อมต่อของเกตเวย์และแพลตฟอร์มข้อความจากในแชทได้เลย
  t341: /commands แสดงรายการคำสั่งสแลชและสกิลที่ติดตั้งทั้งหมดแบบแบ่งหน้า — สะดวกบนแพลตฟอร์มที่ไม่มี Tab completion
  t342: /toolsets แสดงชุดเครื่องมือที่ใช้ได้ทั้งหมด เพื่อให้คุณรู้ว่า -t/--toolsets รับค่าอะไร
  t343: /voice tts สลับโหมด TTS ล้วน — เอเจนต์ตอบออกเสียง แต่คุณยังพิมพ์พรอมต์ได้ตามปกติ
  t344: /reload-skills สแกน ~/.hermes/skills/ ใหม่ เพื่อให้สกิลที่เพิ่งวางโผล่ได้โดยไม่ต้องรีสตาร์ทเซสชัน
  t345: /indicator kaomoji|emoji|unicode|ascii เลือกรูปแบบตัวบ่งชี้ว่ากำลังทำงานของ TUI ที่แสดงขณะเอเจนต์รัน
  t346: /debug อัปโหลดชุดข้อมูลซัพพอร์ต (ข้อมูลระบบ + ล็อก) และคืนลิงก์ที่แชร์ได้ — ใช้ในแชทก็ได้
  t347: 'hermes -z "<prompt>" คือช็อตเดียวสุด ๆ: คำตอบสุดท้ายออกทาง stdout ไม่มีอะไรอื่น — เหมาะกับการไปป์ในสคริปต์'
  t348: hermes chat --pass-session-id แทรก ID เซสชันเข้าพรอมต์ระบบ เพื่อให้เอเจนต์อ้างถึงตัวเองได้
  t349: hermes chat --image path/to/pic.png แนบภาพในเครื่องกับคิวรี -q ชุดเดียว โดยไม่ต้องอัปโหลดแยกขั้น
  t350: hermes chat --ignore-user-config ข้าม config ผู้ใช้ที่กำลังใช้ — ทำให้รายงานบักและการรัน CI ทำซ้ำได้เหมือนกัน
  t351: hermes chat --source tool ใส่แท็กแชทที่เกิดจากโปรแกรม เพื่อไม่ให้รก hermes sessions list
  t352: hermes dump --show-keys รวมฟิงเกอร์ปรินต์ API คีย์ที่ถูกลบบางส่วน เพื่อดีบักซัพพอร์ตลึกขึ้น
  t353: hermes sessions rename <ID> "new title" เปลี่ยนชื่อเซสชันในอดีตได้ ส่วน hermes sessions delete <ID> ลบหนึ่งเซสชันทิ้ง
  t354: hermes import กู้คืนซิปสำรอง Hermes ทั้งชุด ส่วนการส่งออก JSON/JSONL ของเซสชัน นำเข้าจากหน้า Sessions ของแดชบอร์ด
  t355: hermes fallback จัดการห่วงโซ่ fallback_model แบบโต้ตอบ — ไม่ต้องแก้ config.yaml เอง
  t356: hermes pairing หมุนโทเคนจับคู่ DM — ผู้ส่งข้อความแรกหลังการหมุนจะได้สิทธิ์เข้าถึงบอท
  t357: hermes setup พาคนใช้ครั้งแรกตั้งค่าผู้ให้บริการ คีย์ และการต่อแพลตฟอร์มในขั้นตอนโต้ตอบเดียว
  t358: hermes status --deep รันตรวจสุขภาพครบทุกคอมโพเนนต์ ส่วน hermes status ธรรมดาคือมุมมองด่วน
  t359: HERMES_AGENT_TIMEOUT=0 ปิดการฆ่าเอเจนต์ที่ไม่เคลื่อนไหวของเกตเวย์ — ใช้เมื่อรันวิจัยยาวนาน
  t360: HERMES_ENABLE_PROJECT_PLUGINS=1 โหลดปลั๊กอินในรีโปจาก ./.hermes/plugins/ อัตโนมัติ — โดยออกแบบให้ตรวจความเชื่อถือก่อน
  t361: HERMES_DISABLE_FILE_STATE_GUARD=1 ปิดการ์ดป้องกันไฟล์เปลี่ยนหลังคุณอ่านของ patch และ write_file
  t362: HERMES_ALLOW_PRIVATE_URLS=true ให้เครื่องมือเว็บเข้า localhost และเครือข่ายส่วนตัวได้ — ปิดไว้ตามค่าเริ่มต้นในโหมดเกตเวย์
  t363: HERMES_OPTIONAL_SKILLS=name1,name2 ติดตั้งสกิลเสริมจากคาตาล็อกตัวเลือกอัตโนมัติตอนรันครั้งแรกของแต่ละโปรไฟล์
  t364: HERMES_BUNDLED_SKILLS ชี้ไปต้นไม้สกิลในตัวแบบกำหนดเอง — ใช้โดยแพ็กเกจ Homebrew และ Nix
  t365: HERMES_DUMP_REQUEST_STDOUT=1 ดัมพ์เพย์โหลดคำขอ API ทุกตัวออก stdout แทนไฟล์ล็อก
  t366: HERMES_OAUTH_TRACE=1 บันทึกการแลกเปลี่ยนและรีเฟรชโทเคน OAuth ที่ถูกลบบางส่วน เพื่อดีบักการยืนยันตัวตนของผู้ให้บริการ
  t367: HERMES_STREAM_RETRIES (ค่าเริ่มต้น 3) ควบคุมจำนวนครั้งที่พยายามต่อสตรีมใหม่เมื่อเน็ตเวิร์กหลุดชั่วคราว
  t368: HERMES_GATEWAY_BUSY_ACK_ENABLED=false ปิดข้อความตอบรับ ⚡/⏳/⏩ เมื่อผู้ใช้ส่งข้อความถึงเอเจนต์ที่กำลังยุ่ง
  t369: HERMES_AGENT_NOTIFY_INTERVAL (ค่าเริ่มต้น 180s) ตั้งความถี่ที่เกตเวย์ปิงรายงานความคืบหน้าในเทิร์นยาว
  t370: HERMES_RESTART_DRAIN_TIMEOUT (ค่าเริ่มต้น 900s) จำกัดเวลาที่ /restart รองานที่กำลังรันก่อนบังคับ
  t371: HERMES_CHECKPOINT_TIMEOUT (ค่าเริ่มต้น 30s) จำกัดเวลาสร้างเช็กพอยต์ไฟล์ระบบ — เพิ่มขึ้นเมื่อเจอมอนอรีโปยักษ์
  t372: 'image_gen.model ใน config.yaml เลือกโมเดล FAL: flux-2/klein, gpt-image-2, nano-banana-pro และอื่น ๆ'
  t373: image_gen.provider ส่งการสร้างภาพผ่านปลั๊กอิน (OpenAI Images, Codex, FAL) แทนค่าเริ่มต้น
  t374: AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY ชี้การวิเคราะห์ภาพไปยังเอ็นด์พอยท์ที่เข้ากันได้กับ OpenAI ใดก็ได้
  t375: API_SERVER_MODEL_NAME ปรับชื่อโมเดลบน /v1/models — จำเป็นกับการตั้ง Open WebUI หลายโปรไฟล์
  t376: ปลั๊กอินแดชบอร์ดถูกเสิร์ฟจาก /dashboard-plugins/<name>/ — วางไฟล์ลง ~/.hermes/dashboard-plugins/ ได้เลย
  t377: แชทที่แท็ก --source tool ถูกตัดออกจาก hermes sessions list ตามค่าเริ่มต้น — ระบุ --source เองเพื่อดูพวกมัน
